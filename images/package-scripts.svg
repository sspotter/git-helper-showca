<text x="380" y="22" fill="#928374" font-size="12" text-anchor="middle" font-family="Segoe UI,sans-serif">gitt - package scripts</text>
<g font-family="Cascadia Code,Consolas,monospace" font-size="14" style="white-space:pre"><text x="22" y="60" xml:space="preserve" style="white-space:pre"><tspan fill="#83a598">📦 Package scripts (npm)</tspan></text>
<text x="22" y="82" xml:space="preserve" style="white-space:pre"><tspan fill="#ebdbb2"></tspan></text>
<text x="22" y="104" xml:space="preserve" style="white-space:pre"><tspan fill="#fabd2f">❯  1) dev    </tspan><tspan fill="#928374">  next dev</tspan></text>
<text x="22" y="126" xml:space="preserve" style="white-space:pre"><tspan fill="#ebdbb2">   2) build  </tspan><tspan fill="#928374">  next build</tspan></text>
<text x="22" y="148" xml:space="preserve" style="white-space:pre"><tspan fill="#ebdbb2">   3) start  </tspan><tspan fill="#928374">  next start</tspan></text>
<text x="22" y="170" xml:space="preserve" style="white-space:pre"><tspan fill="#ebdbb2">   4) lint   </tspan><tspan fill="#928374">  eslint .</tspan></text>
<text x="22" y="192" xml:space="preserve" style="white-space:pre"><tspan fill="#ebdbb2"></tspan></text>
<text x="22" y="214" xml:space="preserve" style="white-space:pre"><tspan fill="#ebdbb2">Run </tspan><tspan fill="#8ec07c">npm run dev</tspan><tspan fill="#ebdbb2"> in a new terminal window?</tspan></text>
